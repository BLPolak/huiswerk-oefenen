<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiskunde — 3 HAVO</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Nunito, sans-serif; background: #f8fafc; color: #1e293b; }
    a { color: inherit; text-decoration: none; }
    header {
      background: linear-gradient(135deg, #0d9488, #0ea5e9);
      color: white; padding: 1.2rem 1.5rem;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.4rem; font-weight: 800; }
    header p  { font-size: .9rem; opacity: .85; margin-top: .2rem; }
    header a  { font-size: .85rem; opacity: .8; display: inline-block; margin-top: .3rem; }
    header a:hover { opacity: 1; }
    .tab-nav { display: flex; flex-wrap: wrap; gap: .5rem; padding: 1rem 1.5rem; background: #fff; border-bottom: 2px solid #e2e8f0; }
    .tab-btn { padding: .5rem 1rem; border: none; border-radius: 8px; background: #e5e7eb; cursor: pointer; font-family: Nunito, sans-serif; font-size: .9rem; font-weight: 700; transition: background .2s, color .2s; }
    .tab-btn.active { background: linear-gradient(135deg, #0d9488, #0ea5e9); color: #fff; }
    .tab-btn:hover:not(.active) { background: #d1d5db; }
    .tab-content { display: none; padding: 1.5rem; max-width: 820px; margin: 0 auto; }
    .tab-content.active { display: block; }
    .uitleg-card, .oefening-kaart {
      background: #fff; border-radius: 12px; padding: 1.5rem;
      margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }
    .uitleg-card h2 { color: #0d9488; margin-bottom: 1rem; font-size: 1.2rem; }
    .uitleg-card h3 { color: #0369a1; margin: 1rem 0 .5rem; font-size: 1rem; }
    .oefening-kaart h3 { color: #0d9488; margin-bottom: .5rem; font-size: 1.1rem; }
    .regel-blok { border-radius: 8px; padding: .9rem 1.1rem; margin: .6rem 0; }
    .regel-blok p { margin: .2rem 0; line-height: 1.5; }
    .groen     { background: #d1fae5; border-left: 4px solid #10b981; }
    .oranje    { background: #fef3c7; border-left: 4px solid #f59e0b; }
    .rood-blok { background: #fee2e2; border-left: 4px solid #ef4444; }
    .blauw     { background: #eff6ff; border-left: 4px solid #3b82f6; }
    .stappen { display: flex; flex-direction: column; gap: .5rem; margin: .8rem 0; }
    .stap { background: #eff6ff; border-left: 4px solid #3b82f6; padding: .6rem 1rem; border-radius: 6px; font-weight: 700; font-size: .95rem; }
    .voorbeeld-blok { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; margin-top: .8rem; line-height: 1.7; }
    .score-balk  { font-size: .88rem; color: #6b7280; margin-bottom: .7rem; }
    .vraag-tekst { font-size: 1.15rem; font-weight: 700; min-height: 2rem; margin: .75rem 0; line-height: 1.4; }
    .mc-grid { display: flex; flex-direction: column; gap: .5rem; margin: .6rem 0 .8rem; }
    .mc-btn {
      padding: .7rem 1rem; border: 2px solid #e2e8f0; border-radius: 8px;
      background: #fff; cursor: pointer; font-family: Nunito, sans-serif;
      font-size: .98rem; font-weight: 600; text-align: left;
      transition: border-color .15s, background .15s;
    }
    .mc-btn:hover { border-color: #0d9488; background: #f0fdfa; }
    .feedback      { min-height: 1.5rem; font-weight: 700; margin: .4rem 0; font-size: .97rem; }
    .feedback.goed { color: #059669; }
    .feedback.fout { color: #dc2626; }
    .knoppen-rij { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .8rem; }
    .knoppen-rij button {
      padding: .5rem 1rem; border: none; border-radius: 8px;
      background: #0d9488; color: #fff; font-family: Nunito, sans-serif;
      font-weight: 700; cursor: pointer; font-size: .9rem;
    }
    .knoppen-rij button:hover { background: #0b8073; }
    footer { text-align: center; padding: 1.5rem; color: #94a3b8; font-size: .85rem; }
  </style>
</head>
<body>

<header>
  <h1>&#128208; Wiskunde</h1>
  <p>3 HAVO</p>
  <a href="../">&larr; Terug naar overzicht</a>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('binnenkort',this)">&#128679; Binnenkort</button>
</nav>

<div id="tab-binnenkort" class="tab-content active">
  <div class="uitleg-card">
    <p>Hier komt de oefenstof voor Wiskunde zodra het eerste proefwerk bekend is.</p>
  </div>
</div>

<footer>Gemaakt voor Sam &middot; 3 HAVO</footer>

<script>
  function showTab(id,btn){document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active');});document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});document.getElementById('tab-'+id).classList.add('active');btn.classList.add('active');}
  function fisherYates(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
  function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
</script>
</body>
</html>
