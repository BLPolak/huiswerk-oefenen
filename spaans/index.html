<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spaans — 3 HAVO</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rood: #c53030;
  --rood-licht: #feb2b2;
  --geel: #d69e2e;
  --geel-licht: #fefcbf;
  --donker: #1a202c;
  --grijs: #718096;
  --bg: #f7fafc;
}

body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, #c53030 0%, #9b2c2c 50%, #d69e2e 100%);
  min-height: 100vh;
  padding: 0 0 4rem;
}

/* ── HEADER ── */
.header {
  background: rgba(0,0,0,0.2);
  backdrop-filter: blur(10px);
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
}

.terug {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 0.5rem 1rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  transition: background 0.15s;
}
.terug:hover { background: rgba(255,255,255,0.3); }

.header-title {
  color: #fff;
  font-size: 1.4rem;
  font-weight: 900;
  flex: 1;
  text-align: center;
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 0.4rem;
  max-width: 900px;
  margin: 1.5rem auto 0;
  padding: 0 1rem;
  flex-wrap: wrap;
}

.tab-btn {
  flex: 1;
  min-width: 120px;
  padding: 0.75rem 0.6rem;
  border: none;
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.82rem;
  cursor: pointer;
  background: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.85);
  transition: all 0.2s;
  line-height: 1.2;
  text-align: center;
}
.tab-btn.actief {
  background: #fff;
  color: var(--rood);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.tab-btn:hover:not(.actief) { background: rgba(255,255,255,0.3); color: #fff; }

/* ── MAIN CONTENT ── */
.content {
  max-width: 700px;
  margin: 1.5rem auto 0;
  padding: 0 1rem;
}

.tab-content { display: block; }

/* ── SO BANNER ── */
.so-banner {
  background: linear-gradient(135deg, #744210 0%, #d69e2e 100%);
  border-radius: 16px;
  padding: 1rem 1.5rem;
  margin-bottom: 1.5rem;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.28);
}
.so-banner-tekst {
  font-size: 1.2rem;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* ── PLACEHOLDER ── */
.placeholder-box {
  background: rgba(255,255,255,0.12);
  border: 2px dashed rgba(255,255,255,0.4);
  border-radius: 18px;
  padding: 3rem 1.5rem;
  text-align: center;
  color: rgba(255,255,255,0.8);
  font-size: 1.1rem;
  font-weight: 700;
}
.placeholder-box p { margin-top: 0.5rem; font-size: 0.9rem; opacity: 0.65; font-weight: 600; }

/* ── INLINE FLASHCARD ── */
.fc-wrapper {
  background: #fff;
  border-radius: 24px;
  padding: 1.6rem 1.5rem 2rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

.fc-topbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.fc-titel {
  font-weight: 900;
  font-size: 1.05rem;
  color: var(--donker);
}
.fc-teller {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--grijs);
  background: #f7fafc;
  padding: 0.3rem 0.75rem;
  border-radius: 8px;
}

.fc-score-bar {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.fc-score-goed {
  font-size: 0.82rem;
  font-weight: 800;
  color: #38a169;
  background: #f0fff4;
  border: 1.5px solid #9ae6b4;
  border-radius: 8px;
  padding: 0.25rem 0.6rem;
}
.fc-score-fout {
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--rood);
  background: #fff5f5;
  border: 1.5px solid var(--rood-licht);
  border-radius: 8px;
  padding: 0.25rem 0.6rem;
}

.fc-progress-bar {
  width: 100%;
  height: 7px;
  background: #e2e8f0;
  border-radius: 4px;
  overflow: hidden;
}
.fc-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--rood), var(--geel));
  border-radius: 4px;
  transition: width 0.35s;
}

/* Flip card */
.flip-wrapper {
  width: 100%;
  perspective: 1000px;
  cursor: pointer;
}
.flip-card {
  width: 100%;
  min-height: 210px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.45s;
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  text-align: center;
  min-height: 210px;
}
.flip-front {
  background: linear-gradient(135deg, #fff5f5, #fff);
  border: 2px solid var(--rood-licht);
}
.flip-back {
  background: linear-gradient(135deg, #fffbeb, #fff);
  border: 2px solid #f6e05e;
  transform: rotateY(180deg);
}
.flip-label {
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--grijs);
  margin-bottom: 0.8rem;
}
.flip-tekst {
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--donker);
  line-height: 1.3;
}
.flip-hint {
  font-size: 0.75rem;
  color: var(--grijs);
  font-weight: 600;
  margin-top: 1rem;
}

/* Navigation buttons */
.fc-buttons {
  display: flex;
  gap: 0.6rem;
  width: 100%;
}
.fc-btn {
  flex: 1;
  padding: 0.85rem;
  border: none;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.15s;
}
.fc-btn-prev { background: #e2e8f0; color: #2d3748; }
.fc-btn-prev:hover { background: #cbd5e0; }
.fc-btn-flip { background: var(--rood); color: #fff; flex: 1.4; }
.fc-btn-flip:hover { background: #9b2c2c; }
.fc-btn-next { background: #e2e8f0; color: #2d3748; }
.fc-btn-next:hover { background: #cbd5e0; }

/* Goed / Fout buttons (shown after flip) */
.fc-oordeel {
  display: none;
  gap: 0.6rem;
  width: 100%;
}
.fc-oordeel.zichtbaar { display: flex; }
.fc-btn-goed {
  flex: 1;
  padding: 0.8rem;
  border: none;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  cursor: pointer;
  background: #38a169;
  color: #fff;
  transition: background 0.15s;
}
.fc-btn-goed:hover { background: #276749; }
.fc-btn-fout {
  flex: 1;
  padding: 0.8rem;
  border: none;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  cursor: pointer;
  background: var(--rood);
  color: #fff;
  transition: background 0.15s;
}
.fc-btn-fout:hover { background: #9b2c2c; }

/* Action row: Opnieuw + Shuffle */
.fc-actions {
  display: flex;
  gap: 0.6rem;
  width: 100%;
  justify-content: center;
}
.fc-action-btn {
  background: none;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  padding: 0.5rem 1.1rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--grijs);
  cursor: pointer;
  transition: all 0.15s;
}
.fc-action-btn:hover { border-color: var(--rood); color: var(--rood); }

/* Completion screen */
.fc-klaar {
  display: none;
  width: 100%;
  text-align: center;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  padding: 1rem 0;
}
.fc-klaar.zichtbaar { display: flex; }
.fc-klaar-emoji { font-size: 3rem; }
.fc-klaar-titel {
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--donker);
}
.fc-klaar-score {
  font-size: 1rem;
  font-weight: 700;
  color: var(--grijs);
}
.fc-klaar-score strong { color: #38a169; }
.fc-klaar-btns {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  justify-content: center;
}
.fc-klaar-btn {
  padding: 0.75rem 1.4rem;
  border: none;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.15s;
}
.fc-klaar-btn.shuffle { background: var(--rood); color: #fff; }
.fc-klaar-btn.shuffle:hover { background: #9b2c2c; }
.fc-klaar-btn.opnieuw { background: #e2e8f0; color: #2d3748; }
.fc-klaar-btn.opnieuw:hover { background: #cbd5e0; }

/* ── TYPING EXERCISE ── */
.typen-wrapper {
  background: #fff;
  border-radius: 24px;
  padding: 1.6rem 1.5rem 2rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.typen-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.typen-titel { font-weight: 900; font-size: 1.05rem; color: var(--donker); }
.typen-teller {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--grijs);
  background: #f7fafc;
  padding: 0.3rem 0.75rem;
  border-radius: 8px;
}

.typen-score-bar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.typen-score-goed {
  font-size: 0.82rem; font-weight: 800; color: #38a169;
  background: #f0fff4; border: 1.5px solid #9ae6b4;
  border-radius: 8px; padding: 0.25rem 0.6rem;
}
.typen-score-fout {
  font-size: 0.82rem; font-weight: 800; color: var(--rood);
  background: #fff5f5; border: 1.5px solid var(--rood-licht);
  border-radius: 8px; padding: 0.25rem 0.6rem;
}

.typen-prompt-label {
  font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--grijs); margin-bottom: 0.5rem;
}
.typen-prompt-tekst {
  font-size: 1.2rem; font-weight: 900; color: var(--donker);
  background: linear-gradient(135deg, #fff5f5, #fff);
  border: 2px solid var(--rood-licht);
  border-radius: 14px; padding: 1.2rem 1.4rem;
  line-height: 1.4;
}

.typen-antwoord-label {
  font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--grijs); margin-bottom: 0.4rem;
}
.typen-input {
  width: 100%;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  padding: 0.9rem 1rem;
  font-family: 'Nunito', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--donker);
  resize: none;
  outline: none;
  transition: border-color 0.2s;
  line-height: 1.4;
  min-height: 70px;
}
.typen-input:focus { border-color: var(--rood); }
.typen-input.goed { border-color: #38a169; background: #f0fff4; color: #276749; }
.typen-input.fout { border-color: var(--rood); background: #fff5f5; }

.typen-specials {
  display: flex;
  gap: 0.35rem;
  flex-wrap: wrap;
}
.typen-special-btn {
  background: #f7fafc;
  border: 1.5px solid #e2e8f0;
  border-radius: 8px;
  padding: 0.35rem 0.65rem;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--donker);
  cursor: pointer;
  transition: all 0.15s;
  line-height: 1;
}
.typen-special-btn:hover { border-color: var(--rood); color: var(--rood); background: #fff5f5; }

.typen-feedback {
  display: none;
  border-radius: 12px;
  padding: 0.9rem 1.1rem;
  font-size: 0.92rem;
  font-weight: 700;
  line-height: 1.5;
}
.typen-feedback.goed {
  display: block;
  background: #f0fff4;
  border: 2px solid #9ae6b4;
  color: #276749;
}
.typen-feedback.fout {
  display: block;
  background: #fff5f5;
  border: 2px solid var(--rood-licht);
  color: #742a2a;
}
.typen-feedback .correct-antwoord {
  display: block;
  margin-top: 0.4rem;
  font-size: 0.9rem;
  font-style: italic;
  color: var(--rood);
}

.typen-btns {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
}
.typen-btn {
  padding: 0.8rem 1.2rem;
  border: none;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.15s;
}
.typen-btn.controleer { background: var(--rood); color: #fff; flex: 2; }
.typen-btn.controleer:hover { background: #9b2c2c; }
.typen-btn.controleer:disabled { background: #e2e8f0; color: #a0aec0; cursor: default; }
.typen-btn.volgende { background: var(--donker); color: #fff; flex: 1.5; display: none; }
.typen-btn.volgende:hover { background: #2d3748; }
.typen-btn.volgende.zichtbaar { display: block; }

.typen-actions {
  display: flex;
  gap: 0.6rem;
  justify-content: center;
}
.typen-action-btn {
  background: none;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  padding: 0.5rem 1.1rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--grijs);
  cursor: pointer;
  transition: all 0.15s;
}
.typen-action-btn:hover { border-color: var(--rood); color: var(--rood); }

/* ── RESPONSIVE ── */
@media (max-width: 520px) {
  .header-title { font-size: 1.1rem; }
  .flip-tekst { font-size: 1.25rem; }
  .tab-btn { font-size: 0.75rem; padding: 0.6rem 0.4rem; min-width: 90px; }
  .fc-wrapper { padding: 1.2rem 1rem 1.5rem; }
  .typen-wrapper { padding: 1.2rem 1rem 1.5rem; }
  .typen-prompt-tekst { font-size: 1rem; }
}

/* ── GRAMMAR UITLEG BLOCK ── */
.gram-uitleg {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.14);
  margin-bottom: 1.2rem;
  overflow: hidden;
}
.gram-uitleg-header {
  width: 100%;
  background: none;
  border: none;
  border-left: 5px solid var(--geel);
  padding: 1rem 1.3rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 1rem;
  color: var(--donker);
  text-align: left;
  transition: background 0.15s;
}
.gram-uitleg-header:hover { background: #fffbeb; }
.gram-uitleg-header .chevron {
  font-size: 0.95rem;
  color: var(--grijs);
  transition: transform 0.25s;
}
.gram-uitleg-header.open .chevron { transform: rotate(180deg); }

.gram-uitleg-body {
  display: none;
  padding: 0 1.3rem 1.3rem;
  border-top: 1px solid #e2e8f0;
}
.gram-uitleg-body.open { display: block; }

.gram-sectie { margin-bottom: 1.1rem; }
.gram-sectie:last-child { margin-bottom: 0; }
.gram-sectie-titel {
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--geel);
  margin: 1rem 0 0.5rem;
}
.gram-regel {
  background: #fffbeb;
  border-left: 4px solid var(--geel);
  border-radius: 8px;
  padding: 0.7rem 1rem;
  font-size: 0.9rem;
  color: #744210;
  font-weight: 700;
  margin-bottom: 0.6rem;
  line-height: 1.5;
}
.gram-regel code {
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  color: var(--rood);
}
.gram-conj-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  margin-top: 0.3rem;
}
.gram-conj-table tr:nth-child(even) { background: #f7fafc; }
.gram-conj-table td { padding: 0.38rem 0.6rem; border-bottom: 1px solid #e2e8f0; }
.gram-conj-table tr:last-child td { border-bottom: none; }
.gram-conj-table td:first-child { font-weight: 700; color: var(--grijs); width: 38%; }
.gram-conj-table td:last-child { font-weight: 900; color: var(--rood); font-style: italic; }
.gram-onregel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 0.4rem;
  margin-top: 0.4rem;
}
.gram-onregel-pill {
  background: #fff5f5;
  border: 1.5px solid var(--rood-licht);
  border-radius: 8px;
  padding: 0.4rem 0.8rem;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--donker);
}
.gram-onregel-pill span { color: var(--rood); font-style: italic; margin-left: 0.3rem; }
</style>
</head>
<body>

<div class="header">
  <a class="terug" href="/huiswerk-oefenen/">← Terug</a>
  <div class="header-title">🇪🇸 Spaans — 3 HAVO</div>
  <div style="width:80px"></div>
</div>

<div class="tabs">
  <button class="tab-btn actief" onclick="toonTab('tab-binnenkort', this)">🚧 Binnenkort</button>
</div>

<div class="content">

  <div class="tab-content" id="tab-binnenkort">
    <div class="fc-wrapper">
      <p>Hier komt de oefenstof voor Spaans zodra het eerste proefwerk bekend is.</p>
    </div>
  </div>

</div>

<script>
/* ── TAB NAVIGATION ── */
let actieveTab = 'tab-binnenkort';
function toonTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('actief'));
  document.getElementById(id).style.display = 'block';
  btn.classList.add('actief');
  actieveTab = id;
}

/* ── FISHER-YATES SHUFFLE ── */
function fisherYates(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
</script>

</body>
</html>
