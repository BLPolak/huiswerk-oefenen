<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duits — 3 HAVO</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rood: #dd6b20;
  --rood-licht: #fbd38d;
  --geel: #d69e2e;
  --geel-licht: #fefcbf;
  --donker: #1a202c;
  --grijs: #718096;
  --bg: #f7fafc;
}

body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, #dd6b20 0%, #b7501a 50%, #d69e2e 100%);
  min-height: 100vh;
  padding: 0 0 4rem;
}

/* ── HEADER ── */
.header {
  background: rgba(0,0,0,0.2);
  backdrop-filter: blur(10px);
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
}

.terug {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 0.5rem 1rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  transition: background 0.15s;
}
.terug:hover { background: rgba(255,255,255,0.3); }

.header-title {
  color: #fff;
  font-size: 1.5rem;
  font-weight: 900;
  flex: 1;
  text-align: center;
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 0.5rem;
  max-width: 800px;
  margin: 1.5rem auto 0;
  padding: 0 1rem;
}

.tab-btn {
  flex: 1;
  padding: 0.9rem 1rem;
  border: none;
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  background: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8);
  transition: all 0.2s;
}
.tab-btn.actief {
  background: #fff;
  color: var(--rood);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.tab-btn:hover:not(.actief) { background: rgba(255,255,255,0.3); color: #fff; }

/* ── MAIN CONTENT ── */
.content {
  max-width: 860px;
  margin: 1.5rem auto 0;
  padding: 0 1rem;
}

.sectie { display: none; }
.sectie.actief { display: block; }

/* ── ACCORDION ── */
.accordion {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  margin-bottom: 1rem;
}

.accordion-header {
  width: 100%;
  background: none;
  border: none;
  padding: 1.1rem 1.4rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 1.05rem;
  color: var(--donker);
  text-align: left;
  border-left: 5px solid var(--rood);
  transition: background 0.15s;
}
.accordion-header:hover { background: #fff5f5; }
.accordion-header .chevron {
  font-size: 1rem;
  transition: transform 0.25s;
  color: var(--grijs);
}
.accordion-header.open .chevron { transform: rotate(180deg); }

.accordion-body {
  display: none;
  padding: 0 1.4rem 1.4rem;
  border-top: 1px solid #e2e8f0;
}
.accordion-body.open { display: block; }

/* ── VOCAB TABLE ── */
.vocab-sectie { margin-bottom: 1.2rem; }
.vocab-sectie h4 {
  font-size: 0.82rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--rood);
  margin: 1rem 0 0.5rem;
}

.vocab-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}
.vocab-table tr:nth-child(even) { background: #f7fafc; }
.vocab-table td {
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid #e2e8f0;
}
.vocab-table td:first-child { font-weight: 700; color: var(--donker); width: 50%; }
.vocab-table td:last-child { color: #e53e3e; font-weight: 700; }

/* ── GRAMMAR BOX ── */
.grammar-box {
  background: #fffbeb;
  border-left: 4px solid var(--geel);
  border-radius: 8px;
  padding: 1rem 1.2rem;
  margin: 0.8rem 0;
  font-size: 0.92rem;
}
.grammar-box strong { color: var(--donker); }

.example-table {
  width: 100%;
  border-collapse: collapse;
  margin: 0.8rem 0;
  font-size: 0.9rem;
}
.example-table tr { border-bottom: 1px solid #e2e8f0; }
.example-table tr:last-child { border-bottom: none; }
.example-table td { padding: 0.5rem 0.6rem; }
.example-table td:first-child { font-style: italic; font-weight: 700; color: #dd6b20; width: 55%; }
.example-table td:last-child { color: #2d3748; }

.neg-words {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin: 0.8rem 0;
}
.neg-pill {
  background: #fff5f5;
  border: 2px solid var(--rood-licht);
  border-radius: 10px;
  padding: 0.4rem 0.9rem;
  font-weight: 800;
  font-size: 0.9rem;
  color: var(--rood);
}
.neg-pill span { color: var(--grijs); font-weight: 600; margin-left: 0.4rem; }

/* ── CONJUGATION TABLE ── */
.werkwoord-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-top: 0.8rem;
}

.conj-card {
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #e2e8f0;
}
.conj-card-header {
  background: var(--rood);
  color: #fff;
  font-weight: 900;
  font-size: 1rem;
  padding: 0.6rem 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.conj-card-header span { font-weight: 600; font-size: 0.82rem; opacity: 0.85; }
.conj-table { width: 100%; font-size: 0.88rem; }
.conj-table tr:nth-child(even) { background: #f7fafc; }
.conj-table td { padding: 0.38rem 0.8rem; }
.conj-table td:first-child { font-weight: 700; color: #dd6b20; width: 45%; }
.conj-table td:last-child { color: #2d3748; }
.conj-divider td { border-top: 2px solid #e2e8f0 !important; }

/* ── KLOK TABLE ── */
.klok-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  margin-top: 0.8rem;
}
.klok-table tr:nth-child(even) { background: #f7fafc; }
.klok-table td { padding: 0.45rem 0.7rem; border-bottom: 1px solid #e2e8f0; }
.klok-table td:first-child { font-weight: 700; color: #dd6b20; width: 55%; font-style: italic; }
.klok-table td:last-child { color: #2d3748; font-weight: 600; }

/* ── GETALLEN GRID ── */
.getallen-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 0.5rem;
  margin-top: 0.8rem;
}
.getal-item {
  background: #fff5f5;
  border: 1px solid var(--rood-licht);
  border-radius: 8px;
  padding: 0.5rem 0.7rem;
  text-align: center;
}
.getal-num { font-size: 1.2rem; font-weight: 900; color: var(--rood); }
.getal-spa { font-size: 0.82rem; font-weight: 700; color: #2d3748; margin-top: 0.1rem; }

/* ── FRASES TABLE ── */
.frases-sectie { margin-bottom: 1.2rem; }
.frases-sectie h4 {
  font-size: 0.82rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--rood);
  margin: 1rem 0 0.5rem;
}
.frases-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}
.frases-table tr { border-bottom: 1px solid #e2e8f0; }
.frases-table tr:last-child { border-bottom: none; }
.frases-table tr:nth-child(even) { background: #f7fafc; }
.frases-table td { padding: 0.5rem 0.6rem; vertical-align: top; }
.frases-table td:first-child { font-weight: 700; color: #dd6b20; font-style: italic; width: 50%; }
.frases-table td:last-child { color: #2d3748; }

/* ── FLASHCARD SETS ── */
.sets-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
}

.set-kaart {
  background: #fff;
  border-radius: 16px;
  padding: 1.3rem 1.2rem;
  cursor: pointer;
  border: 2px solid transparent;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.set-kaart:hover {
  border-color: var(--rood);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(197,48,48,0.2);
}
.set-emoji { font-size: 1.8rem; line-height: 1; }
.set-naam { font-weight: 800; font-size: 1rem; color: var(--donker); }
.set-info { font-size: 0.82rem; color: var(--grijs); font-weight: 600; }
.set-richting {
  background: #fff5f5;
  color: var(--rood);
  font-size: 0.75rem;
  font-weight: 800;
  padding: 0.2rem 0.6rem;
  border-radius: 6px;
  align-self: flex-start;
  margin-top: 0.2rem;
}

/* ── FLASHCARD MODAL ── */
#fc-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
#fc-modal.open { display: flex; }

#fc-container {
  background: #fff;
  border-radius: 24px;
  width: 100%;
  max-width: 520px;
  padding: 1.5rem 1.5rem 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  max-height: 90vh;
  overflow-y: auto;
}

.fc-topbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.fc-set-naam { font-weight: 900; font-size: 1.05rem; color: var(--donker); }
#fc-close {
  background: #e2e8f0;
  border: none;
  border-radius: 8px;
  width: 2rem;
  height: 2rem;
  font-size: 1rem;
  cursor: pointer;
  font-weight: 800;
  color: #4a5568;
  display: flex; align-items: center; justify-content: center;
}
#fc-close:hover { background: #cbd5e0; }

.fc-progress-bar {
  width: 100%;
  height: 6px;
  background: #e2e8f0;
  border-radius: 3px;
  overflow: hidden;
}
.fc-progress-fill {
  height: 100%;
  background: var(--rood);
  border-radius: 3px;
  transition: width 0.3s;
}
.fc-progress-text {
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--grijs);
  align-self: flex-end;
}

/* Flip card */
.flip-wrapper {
  width: 100%;
  perspective: 1000px;
  cursor: pointer;
}
.flip-card {
  width: 100%;
  min-height: 200px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.45s;
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  text-align: center;
  min-height: 200px;
}
.flip-front {
  background: linear-gradient(135deg, #fff5f5, #fff);
  border: 2px solid var(--rood-licht);
}
.flip-back {
  background: linear-gradient(135deg, #fffbeb, #fff);
  border: 2px solid #f6e05e;
  transform: rotateY(180deg);
}
.flip-label {
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--grijs);
  margin-bottom: 0.8rem;
}
.flip-tekst {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--donker);
  line-height: 1.3;
}
.flip-hint {
  font-size: 0.78rem;
  color: var(--grijs);
  font-weight: 600;
  margin-top: 1rem;
}

.fc-buttons {
  display: flex;
  gap: 0.6rem;
  width: 100%;
}
.fc-btn {
  flex: 1;
  padding: 0.8rem;
  border: none;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.15s;
}
.fc-btn-prev { background: #e2e8f0; color: #2d3748; }
.fc-btn-prev:hover { background: #cbd5e0; }
.fc-btn-flip { background: var(--rood); color: #fff; flex: 1.4; }
.fc-btn-flip:hover { background: #b7501a; }
.fc-btn-next { background: #e2e8f0; color: #2d3748; }
.fc-btn-next:hover { background: #cbd5e0; }

.fc-shuffle {
  background: none;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  padding: 0.5rem 1rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--grijs);
  cursor: pointer;
  transition: all 0.15s;
}
.fc-shuffle:hover { border-color: var(--rood); color: var(--rood); }

/* ── RESPONSIVE ── */
@media (max-width: 500px) {
  .header-title { font-size: 1.2rem; }
  .flip-tekst { font-size: 1.2rem; }
  .werkwoord-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <a class="terug" href="/huiswerk-oefenen/">← Terug</a>
  <div class="header-title">🇩🇪 Duits — 3 HAVO</div>
  <div style="width:80px"></div>
</div>

<div class="tabs">
  <button class="tab-btn actief" onclick="toonTab('binnenkort', this)">🚧 Binnenkort</button>
</div>

<div class="content">

  <div id="tab-binnenkort" class="sectie actief">
    <div class="grammar-box">
      <p>Hier komt de oefenstof voor Duits zodra het eerste proefwerk bekend is.</p>
    </div>
  </div>

</div><!-- /content -->

<script>
/* ── TAB SWITCHING ── */
function toonTab(naam, btn) {
  document.querySelectorAll('.sectie').forEach(s => s.classList.remove('actief'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('actief'));
  document.getElementById('tab-' + naam).classList.add('actief');
  btn.classList.add('actief');
}
</script>

</body>
</html>
