<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Biologie — 3 HAVO</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rood: #c53030;
  --rood-licht: #feb2b2;
  --geel: #d69e2e;
  --geel-licht: #fefcbf;
  --groen: #2d6a4f;
  --groen-licht: #d8f3dc;
  --donker: #1a202c;
  --grijs: #718096;
  --bg: #f7fafc;
}

body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 50%, #52b788 100%);
  min-height: 100vh;
  padding: 0 0 4rem;
}

.header {
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(10px);
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
}
.terug {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 0.5rem 1rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  transition: background 0.15s;
}
.terug:hover { background: rgba(255,255,255,0.3); }
.header-title {
  color: #fff;
  font-size: 1.5rem;
  font-weight: 900;
  flex: 1;
  text-align: center;
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.tabs {
  display: flex;
  gap: 0.5rem;
  max-width: 860px;
  margin: 1.5rem auto 0;
  padding: 0 1rem;
}
.tab-btn {
  flex: 1;
  padding: 0.9rem 0.5rem;
  border: none;
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  cursor: pointer;
  background: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.85);
  transition: all 0.2s;
}
.tab-btn.actief {
  background: #fff;
  color: var(--groen);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.tab-btn:hover:not(.actief) { background: rgba(255,255,255,0.3); color: #fff; }

.content {
  max-width: 860px;
  margin: 1.5rem auto 0;
  padding: 0 1rem;
}
.sectie { display: none; }
.sectie.actief { display: block; }

/* SCORE BAR */
.score-bar {
  background: rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 0.8rem 1.2rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #fff;
  font-weight: 800;
  font-size: 0.95rem;
}
.score-num { font-size: 1.3rem; font-weight: 900; }

/* ACCORDION */
.accordion {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  margin-bottom: 1rem;
}
.accordion-header {
  width: 100%;
  background: none;
  border: none;
  padding: 1.1rem 1.4rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 1.05rem;
  color: var(--donker);
  text-align: left;
  border-left: 5px solid var(--groen);
  transition: background 0.15s;
}
.accordion-header:hover { background: #f0fff4; }
.accordion-header .chevron { font-size: 1rem; transition: transform 0.25s; color: var(--grijs); }
.accordion-header.open .chevron { transform: rotate(180deg); }
.accordion-body { display: none; padding: 1rem 1.4rem 1.4rem; border-top: 1px solid #e2e8f0; }
.accordion-body.open { display: block; }

/* THEORIE BLOK */
.theorie-blok {
  background: #f0fff4;
  border-left: 4px solid var(--groen);
  border-radius: 8px;
  padding: 0.8rem 1.1rem;
  margin-bottom: 0.9rem;
  font-size: 0.92rem;
  color: var(--donker);
  line-height: 1.6;
}
.theorie-blok-titel {
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--groen);
  margin-bottom: 0.5rem;
}
.theorie-blok p { margin-bottom: 0.4rem; }
.theorie-blok p:last-child { margin-bottom: 0; }
.theorie-blok ul { margin: 0.4rem 0 0 1.2rem; }
.theorie-blok li { margin-bottom: 0.25rem; }
.begrip { font-weight: 800; color: var(--groen); }
.kader {
  background: #fffbeb;
  border-left: 4px solid var(--geel);
  border-radius: 8px;
  padding: 0.7rem 1rem;
  margin: 0.6rem 0;
  font-size: 0.9rem;
}
.kader strong { color: #744210; }

/* FLASHCARD SETS */
.sets-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 1rem;
}
.set-kaart {
  background: #fff;
  border-radius: 16px;
  padding: 1.3rem 1.2rem;
  cursor: pointer;
  border: 2px solid transparent;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.set-kaart:hover {
  border-color: var(--groen);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(45,106,79,0.2);
}
.set-emoji { font-size: 1.8rem; line-height: 1; }
.set-naam { font-weight: 800; font-size: 1rem; color: var(--donker); }
.set-info { font-size: 0.82rem; color: var(--grijs); font-weight: 600; }

/* FLASHCARD MODAL */
#fc-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
#fc-modal.open { display: flex; }
#fc-container {
  background: #fff;
  border-radius: 24px;
  width: 100%;
  max-width: 520px;
  padding: 1.5rem 1.5rem 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  max-height: 90vh;
  overflow-y: auto;
}
.fc-topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; }
.fc-set-naam { font-weight: 900; font-size: 1.05rem; color: var(--donker); }
#fc-close {
  background: #e2e8f0; border: none; border-radius: 8px;
  width: 2rem; height: 2rem; font-size: 1rem; cursor: pointer;
  font-weight: 800; color: #4a5568;
  display: flex; align-items: center; justify-content: center;
}
#fc-close:hover { background: #cbd5e0; }
.fc-progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
.fc-progress-fill { height: 100%; background: var(--groen); border-radius: 3px; transition: width 0.3s; }
.fc-progress-text { font-size: 0.82rem; font-weight: 800; color: var(--grijs); align-self: flex-end; }

.flip-wrapper { width: 100%; perspective: 1000px; cursor: pointer; }
.flip-card {
  width: 100%; min-height: 200px; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s;
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 18px; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 1.5rem; text-align: center; min-height: 200px;
}
.flip-front { background: linear-gradient(135deg, #f0fff4, #fff); border: 2px solid var(--groen-licht); }
.flip-back { background: linear-gradient(135deg, #fffbeb, #fff); border: 2px solid #f6e05e; transform: rotateY(180deg); }
.flip-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--grijs); margin-bottom: 0.8rem; }
.flip-tekst { font-size: 1.4rem; font-weight: 900; color: var(--donker); line-height: 1.3; }
.flip-hint { font-size: 0.78rem; color: var(--grijs); font-weight: 600; margin-top: 1rem; }

.fc-buttons { display: flex; gap: 0.6rem; width: 100%; }
.fc-btn {
  flex: 1; padding: 0.8rem; border: none; border-radius: 12px;
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem;
  cursor: pointer; transition: all 0.15s;
}
.fc-btn-prev { background: #e2e8f0; color: #2d3748; }
.fc-btn-prev:hover { background: #cbd5e0; }
.fc-btn-flip { background: var(--groen); color: #fff; flex: 1.4; }
.fc-btn-flip:hover { background: #1b4332; }
.fc-btn-next { background: #e2e8f0; color: #2d3748; }
.fc-btn-next:hover { background: #cbd5e0; }
.fc-shuffle {
  background: none; border: 2px solid #e2e8f0; border-radius: 10px;
  padding: 0.5rem 1rem; font-family: 'Nunito', sans-serif;
  font-weight: 700; font-size: 0.85rem; color: var(--grijs); cursor: pointer; transition: all 0.15s;
}
.fc-shuffle:hover { border-color: var(--groen); color: var(--groen); }
.fc-opnieuw {
  background: none; border: 2px solid #e2e8f0; border-radius: 10px;
  padding: 0.5rem 1rem; font-family: 'Nunito', sans-serif;
  font-weight: 700; font-size: 0.85rem; color: var(--grijs); cursor: pointer; transition: all 0.15s;
}
.fc-opnieuw:hover { border-color: var(--groen); color: var(--groen); }
.fc-extra-btns { display: flex; gap: 0.5rem; }

/* MC OEFENINGEN */
.oefenblok {
  background: #fff;
  border-radius: 16px;
  padding: 1.4rem;
  margin-bottom: 1rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.oefenblok-titel {
  font-weight: 900;
  font-size: 1rem;
  color: var(--groen);
  margin-bottom: 1rem;
  padding-bottom: 0.6rem;
  border-bottom: 2px solid var(--groen-licht);
}
.mc-vraag { margin-bottom: 1.3rem; }
.mc-vraag:last-child { margin-bottom: 0; }
.mc-vraag p { font-weight: 700; color: var(--donker); margin-bottom: 0.5rem; font-size: 0.95rem; line-height: 1.5; }
.mc-opties { display: flex; flex-direction: column; gap: 0.4rem; }
.mc-optie {
  background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px;
  padding: 0.55rem 1rem; font-family: 'Nunito', sans-serif;
  font-size: 0.9rem; font-weight: 600; color: var(--donker);
  cursor: pointer; text-align: left; transition: all 0.15s;
}
.mc-optie:hover:not(:disabled) { border-color: var(--groen); background: #f0fff4; }
.mc-optie.goed { background: #f0fff4; border-color: #38a169; color: #276749; font-weight: 800; }
.mc-optie.fout { background: #fff5f5; border-color: var(--rood); color: var(--rood); }
.mc-optie:disabled { cursor: default; }

.oefenen-nav {
  display: flex;
  gap: 0.6rem;
  margin-top: 0.5rem;
  align-items: center;
  flex-wrap: wrap;
}
.nav-btn {
  padding: 0.6rem 1.2rem; border: none; border-radius: 10px;
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.88rem;
  cursor: pointer; transition: all 0.15s;
}
.nav-btn-primary { background: var(--groen); color: #fff; }
.nav-btn-primary:hover { background: #1b4332; }
.nav-btn-secondary { background: #e2e8f0; color: #2d3748; }
.nav-btn-secondary:hover { background: #cbd5e0; }
.score-display { font-weight: 800; color: #fff; font-size: 0.9rem; margin-left: auto; }

@media (max-width: 500px) {
  .header-title { font-size: 1.2rem; }
  .flip-tekst { font-size: 1.15rem; }
  .tabs { gap: 0.3rem; }
  .tab-btn { font-size: 0.82rem; padding: 0.8rem 0.3rem; }
}
</style>
</head>
<body>

<div class="header">
  <a class="terug" href="/huiswerk-oefenen/">← Terug</a>
  <div class="header-title">🌿 Biologie — 3 HAVO</div>
  <div style="width:80px"></div>
</div>

<div class="tabs">
  <button class="tab-btn actief" onclick="toonTab('binnenkort', this)">🚧 Binnenkort</button>
</div>

<div class="content">

<div id="tab-binnenkort" class="sectie actief">
  <div class="oefenblok">
    <p>Hier komt de oefenstof voor Biologie zodra het eerste proefwerk bekend is.</p>
  </div>
</div>

</div><!-- /content -->

<script>
function fisher_yates(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function fisher_yates_vragen(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function toonTab(id, btn) {
  document.querySelectorAll('.sectie').forEach(s => s.classList.remove('actief'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('actief'));
  document.getElementById('tab-' + id).classList.add('actief');
  btn.classList.add('actief');
}

function toggleAccordion(header) {
  const body = header.nextElementSibling;
  const isOpen = body.classList.contains('open');
  // Sluit alle andere
  document.querySelectorAll('.accordion-body.open').forEach(b => {
    b.classList.remove('open');
    b.previousElementSibling.classList.remove('open');
  });
  if (!isOpen) {
    body.classList.add('open');
    header.classList.add('open');
  }
}

function sluitModal() {
  document.getElementById('fc-modal').classList.remove('open');
}
</script>
</body>
</html>
