<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nederlands — 3 HAVO</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rood: #e53e3e;
  --rood-licht: #fc8181;
  --rood-bg: #fff5f5;
  --donker: #1a202c;
  --groen: #38a169;
  --oranje: #d97706;
  --blauw: #3182ce;
  --grijs: #718096;
  --geel: #d69e2e;
  --geel-bg: #fefcbf;
  --geel-rand: #f6e05e;
}

body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
  min-height: 100vh;
  color: var(--donker);
  padding: 0 1rem 3rem;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--donker);
  color: #fff;
  text-align: center;
  padding: 1rem 1rem 0.8rem;
  margin: 0 -1rem 1.2rem;
}
header h1 { font-size: 1.7rem; font-weight: 900; color: #fff; }
header p { color: rgba(255,255,255,0.65); font-size: 0.9rem; margin-top: 0.25rem; font-weight: 600; }

.terug {
  display: inline-flex; align-items: center; gap: 0.4rem;
  background: rgba(255,255,255,0.12); color: #fff; text-decoration: none;
  font-weight: 800; font-size: 0.82rem; padding: 0.35rem 0.85rem;
  border-radius: 10px; margin-bottom: 0.6rem; transition: background 0.15s;
  border: 1.5px solid rgba(255,255,255,0.25);
}
.terug:hover { background: rgba(255,255,255,0.22); }

/* ── TABS ── */
.tabs {
  display: flex; gap: 0.5rem; justify-content: center;
  max-width: 820px; margin: 0 auto 1.5rem; flex-wrap: wrap;
}
.tab-knop, .tab-btn {
  padding: 0.65rem 1.8rem; border-radius: 20px;
  border: 2px solid var(--rood);
  background: transparent; color: var(--rood);
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem; font-weight: 800;
  cursor: pointer; transition: all 0.15s;
}
.tab-knop:hover, .tab-btn:hover { background: var(--rood-bg); }
.tab-knop.actief, .tab-btn.actief { background: var(--rood); color: #fff; }

/* ── CONTENT WRAPPER ── */
.tab-inhoud { display: none; max-width: 820px; margin: 0 auto; }
.tab-inhoud.zichtbaar { display: block; }

/* ── KAART ── */
.kaart {
  background: #fff;
  border-radius: 16px;
  padding: 1.5rem 1.8rem;
  margin-bottom: 1.2rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  border-left: 5px solid var(--rood);
}
.kaart h2 {
  font-size: 1.1rem; font-weight: 900; color: var(--donker);
  margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
}
.kaart p, .kaart li {
  font-size: 0.92rem; color: #4a5568; font-weight: 600; line-height: 1.6;
}

.chip {
  display: inline-block;
  background: var(--rood-bg); color: var(--rood);
  font-size: 0.78rem; font-weight: 800;
  padding: 0.15rem 0.6rem; border-radius: 99px;
  border: 1.5px solid var(--rood-licht);
}

/* ── MC OPTIES ── */
.mc-opties { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.3rem; }
.mc-optie {
  display: flex; align-items: center; gap: 0.7rem;
  border: 2px solid #e2e8f0; border-radius: 10px;
  padding: 0.7rem 1rem; cursor: pointer;
  transition: all 0.15s; background: #fff;
  font-family: 'Nunito', sans-serif;
  font-size: 0.92rem; font-weight: 700; color: var(--donker);
  text-align: left; width: 100%;
}
.mc-optie:hover:not(:disabled) { border-color: var(--rood); background: var(--rood-bg); }
.mc-optie .optie-letter {
  background: #edf2f7; color: #4a5568;
  font-size: 0.8rem; font-weight: 900;
  padding: 0.2rem 0.55rem; border-radius: 6px; flex-shrink: 0;
}
.mc-optie.goed { background: #f0fff4; border-color: var(--groen); color: #22543d; }
.mc-optie.goed .optie-letter { background: var(--groen); color: #fff; }
.mc-optie.fout { background: #fff5f5; border-color: var(--rood); color: #742a2a; }
.mc-optie.fout .optie-letter { background: var(--rood); color: #fff; }

/* ── ZINSDELEN SPECIFIEK ── */
.zd-badge {
  display: inline-block; background: var(--rood); color: #fff;
  font-size: 0.72rem; font-weight: 900;
  padding: 0.15rem 0.55rem; border-radius: 99px; flex-shrink: 0;
}
.truc-box {
  background: var(--geel-bg); border: 1.5px solid var(--geel-rand);
  border-radius: 8px; padding: 0.5rem 0.8rem;
  font-size: 0.85rem; font-weight: 700; color: #744210;
  margin: 0.5rem 0; line-height: 1.55;
}
.vb-box {
  background: #f7fafc; border-radius: 8px;
  padding: 0.4rem 0.8rem; font-size: 0.85rem;
  font-weight: 700; color: #4a5568; font-style: italic;
  margin-top: 0.35rem; line-height: 1.5;
}
.let-op-box {
  background: #fffbeb; border: 2px solid #fcd34d;
  border-radius: 12px; padding: 1rem 1.2rem;
  font-size: 0.88rem; font-weight: 700; color: #78350f;
  margin-bottom: 1.2rem; line-height: 1.7;
}
.let-op-box strong { color: #92400e; }
.let-op-box ul { padding-left: 1.2rem; margin-top: 0.4rem; }
.let-op-box ul li { margin-bottom: 0.2rem; }

/* ── OEFENING HEADER ── */
.oef-header {
  display: flex; align-items: center; gap: 0.6rem;
  margin-bottom: 1.2rem; flex-wrap: wrap;
}
.oef-score { font-size: 0.92rem; font-weight: 800; color: var(--grijs); flex: 1; min-width: 120px; }
.oef-score strong { color: var(--rood); }
.oef-voortgang { font-size: 0.85rem; font-weight: 700; color: var(--grijs); }
.schud-knop {
  display: inline-flex; align-items: center; gap: 0.3rem;
  background: var(--geel-bg); color: #78350f;
  border: 2px solid var(--geel-rand); border-radius: 10px;
  padding: 0.4rem 0.9rem; font-family: 'Nunito', sans-serif;
  font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.schud-knop:hover { background: var(--geel-rand); }
.opnieuw-stijl {
  background: var(--rood-bg); color: var(--rood); border-color: var(--rood-licht);
}
.opnieuw-stijl:hover { background: var(--rood-licht); color: #fff; }

/* ── SUB-TABS ── */
.sub-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
.sub-tab {
  padding: 0.45rem 1.2rem; border-radius: 14px;
  border: 2px solid var(--rood); background: transparent; color: var(--rood);
  font-family: 'Nunito', sans-serif; font-size: 0.88rem; font-weight: 800;
  cursor: pointer; transition: all 0.15s;
}
.sub-tab:hover { background: var(--rood-bg); }
.sub-tab.actief { background: var(--rood); color: #fff; }

/* ── FLASHCARD ENKELVOUDIG ── */
.fc-enkel-voor {
  background: var(--rood); border-radius: 18px;
  padding: 2.5rem 2rem; text-align: center;
  margin-bottom: 1.2rem; cursor: pointer;
  box-shadow: 0 6px 24px rgba(229,62,62,0.25);
  min-height: 160px; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  user-select: none; transition: transform 0.1s;
}
.fc-enkel-voor:active { transform: scale(0.98); }
.fc-enkel-voor .fc-label { font-size: 0.75rem; font-weight: 800; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
.fc-enkel-voor .fc-woord { font-size: 2.2rem; font-weight: 900; color: #fff; line-height: 1.2; }
.fc-enkel-voor .fc-hint { font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.55); margin-top: 0.8rem; }

.fc-enkel-achter {
  background: #fff; border-radius: 18px; padding: 2rem; text-align: center;
  margin-bottom: 1.2rem; display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  border: 2.5px solid var(--rood);
  min-height: 160px; flex-direction: column;
  align-items: center; justify-content: center;
}
.fc-enkel-achter.zichtbaar { display: flex; }
.fc-enkel-achter .fc-naam { font-size: 1.5rem; font-weight: 900; color: var(--donker); margin-bottom: 0.4rem; }
.fc-enkel-achter .fc-def { font-size: 0.9rem; font-weight: 700; color: #4a5568; line-height: 1.5; }

.fc-goed-fout-rij { display: none; gap: 0.8rem; margin-bottom: 1rem; }
.fc-goed-fout-rij.zichtbaar { display: flex; }
.fc-goed-fout-rij button {
  flex: 1; padding: 0.8rem; border: none; border-radius: 12px;
  font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800;
  cursor: pointer; transition: opacity 0.15s;
}
.fc-goed-fout-rij .fc-goed-btn { background: var(--groen); color: #fff; }
.fc-goed-fout-rij .fc-fout-btn { background: var(--rood); color: #fff; }
.fc-goed-fout-rij button:hover { opacity: 0.88; }

/* ── ZIN KAART ── */
.zin-kaart {
  background: var(--rood); border-radius: 18px;
  padding: 2rem 1.8rem; text-align: center; margin-bottom: 1.2rem;
  box-shadow: 0 6px 24px rgba(229,62,62,0.25);
  font-size: 1.2rem; font-weight: 800; color: #fff; line-height: 1.8;
}
.zin-kaart .hl { text-decoration: underline; font-style: italic; }

/* ── OPEN INPUT ── */
.open-rij { display: flex; gap: 0.6rem; margin-bottom: 0.9rem; }
.open-input {
  flex: 1; border: 2px solid #e2e8f0; border-radius: 12px;
  padding: 0.75rem 1rem; font-family: 'Nunito', sans-serif;
  font-size: 1rem; font-weight: 700; color: var(--donker);
  transition: border-color 0.15s;
}
.open-input:focus { outline: none; border-color: var(--rood); }
.open-input:disabled { background: #f7fafc; color: #a0aec0; }

.controleer-knop {
  background: var(--rood); color: #fff; border: none; border-radius: 12px;
  padding: 0.75rem 1.4rem; font-family: 'Nunito', sans-serif;
  font-size: 0.95rem; font-weight: 800; cursor: pointer;
  transition: opacity 0.15s; white-space: nowrap;
}
.controleer-knop:hover:not(:disabled) { opacity: 0.88; }
.controleer-knop:disabled { opacity: 0.4; cursor: default; }

/* ── FEEDBACK ── */
.feedback-box {
  display: none; border-radius: 12px; padding: 0.85rem 1.1rem;
  font-size: 0.92rem; font-weight: 700; line-height: 1.5; margin-bottom: 0.9rem;
}
.feedback-box.zichtbaar { display: block; }
.feedback-box.goed { background: var(--geel-bg); border: 2px solid var(--geel-rand); color: #744210; }
.feedback-box.fout { background: var(--rood-bg); border: 2px solid var(--rood-licht); color: #742a2a; }

/* ── VOLGENDE ── */
.volgende-knop {
  display: none; width: 100%; background: var(--donker); color: #fff;
  border: none; border-radius: 12px; padding: 0.85rem;
  font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800;
  cursor: pointer; transition: opacity 0.15s; text-align: center;
}
.volgende-knop.zichtbaar { display: block; }
.volgende-knop:hover { opacity: 0.85; }

/* ── EINDE ── */
.einde-kaart {
  background: #fff; border-radius: 18px; padding: 2.5rem 2rem;
  text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,0.1);
  border-top: 5px solid var(--rood);
}
.einde-score { font-size: 3rem; font-weight: 900; color: var(--rood); line-height: 1; margin-bottom: 0.4rem; }
.einde-label { font-size: 1rem; font-weight: 700; color: var(--grijs); margin-bottom: 1.5rem; }
.opnieuw-knop {
  background: var(--rood); color: #fff; border: none; border-radius: 12px;
  padding: 0.85rem 2rem; font-family: 'Nunito', sans-serif;
  font-size: 1rem; font-weight: 800; cursor: pointer; transition: opacity 0.15s;
}
.opnieuw-knop:hover { opacity: 0.88; }

/* ── ONT-VELDEN (TAB 5) ── */
.ont-zin-kaart {
  background: #fff; border-radius: 16px;
  padding: 1.5rem 1.8rem; margin-bottom: 1.2rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  border-left: 5px solid var(--rood);
}
.ont-zin-tekst { font-size: 1rem; font-weight: 700; color: var(--donker); margin-bottom: 0.9rem; line-height: 1.5; }
.ont-tabel-wrap { overflow-x: auto; margin-bottom: 0.7rem; }
.ont-tabel { border-collapse: collapse; min-width: 100%; font-size: 0.85rem; }
.ont-tabel th { background: var(--rood); color: #fff; padding: 0.4rem 0.6rem; font-weight: 800; text-align: center; white-space: nowrap; }
.ont-tabel td { padding: 0.35rem 0.4rem; vertical-align: top; min-width: 80px; }
.ont-input {
  width: 100%; min-width: 70px;
  border: 2px solid #e2e8f0; border-radius: 8px;
  padding: 0.4rem 0.5rem;
  font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--donker);
  transition: border-color 0.15s;
}
.ont-input:focus { outline: none; border-color: var(--rood); }
.ont-input.goed { border-color: var(--groen); background: #f0fff4; }
.ont-input.fout { border-color: var(--rood); background: var(--rood-bg); }
.ont-input:disabled { cursor: default; }
.ont-fb { font-size: 0.75rem; font-weight: 700; min-height: 1.1em; margin-top: 0.15rem; line-height: 1.3; }
.ont-noot {
  background: var(--geel-bg); border: 1.5px solid var(--geel-rand);
  border-radius: 8px; padding: 0.5rem 0.8rem;
  font-size: 0.83rem; font-weight: 700; color: #744210; margin: 0.5rem 0;
}
.ont-controleer-knop {
  background: var(--rood); color: #fff; border: none; border-radius: 10px;
  padding: 0.5rem 1.2rem; font-family: 'Nunito', sans-serif;
  font-size: 0.88rem; font-weight: 800; cursor: pointer; transition: opacity 0.15s; margin-top: 0.4rem;
}
.ont-controleer-knop:hover:not(:disabled) { opacity: 0.88; }
.ont-controleer-knop:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<header>
  <a class="terug" href="/huiswerk-oefenen/">&#8592; Alle vakken</a>
  <h1>&#128218; Nederlands</h1>
  <p>3 HAVO</p>
</header>

<div class="tabs">
  <button class="tab-btn actief" onclick="toonTab('binnenkort', this)">&#128679; Binnenkort</button>
</div>

<div id="tab-binnenkort" class="tab-inhoud zichtbaar">
  <div class="kaart">
    <p>Hier komt de oefenstof voor Nederlands zodra het eerste proefwerk bekend is.</p>
  </div>
</div>

<script>
// ── TAB WISSELEN ──
function toonTab(naam, knop) {
  document.querySelectorAll('.tab-inhoud').forEach(function(t) { t.classList.remove('zichtbaar'); });
  document.querySelectorAll('.tab-btn').forEach(function(k) { k.classList.remove('actief'); });
  document.getElementById('tab-' + naam).classList.add('zichtbaar');
  if (knop) knop.classList.add('actief');
}

// ── FISHER-YATES ──
function schud(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function showTab(naam) {
  document.querySelectorAll('.tab-inhoud').forEach(function(t) { t.classList.remove('zichtbaar'); });
  document.querySelectorAll('.tab-btn').forEach(function(k) { k.classList.remove('actief'); });
  var el = document.getElementById('tab-' + naam);
  if (el) el.classList.add('zichtbaar');
  document.querySelectorAll('.tab-btn').forEach(function(k) {
    if ((k.getAttribute('onclick') || '').indexOf("showTab('" + naam + "')") !== -1) k.classList.add('actief');
  });
}
</script>

</body>
</html>
