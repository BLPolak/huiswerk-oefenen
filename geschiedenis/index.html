<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geschiedenis — 3 HAVO</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --rood: #c0392b;
      --geel: #f39c12;
      --donker: #1a1a2e;
      --grijs: #7f8c8d;
      --bg: #f8f9fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: #333; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--donker); color: white;
      padding: 0.9rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    header a { color: var(--geel); text-decoration: none; font-size: 0.9rem; font-weight: 700; }
    header h1 { font-size: 1.1rem; font-weight: 800; }

    .hero {
      background: linear-gradient(135deg, var(--rood), var(--geel));
      color: white; padding: 2rem 1.5rem; text-align: center;
    }
    .hero h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.3rem; }
    .hero p { opacity: 0.9; }

    .tab-buttons {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      background: white; border-bottom: 2px solid #eee;
      position: sticky; top: 52px; z-index: 90;
    }
    .tab-btn {
      padding: 0.45rem 1rem;
      border: 2px solid var(--rood); border-radius: 2rem;
      background: white; color: var(--rood);
      font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.88rem;
      cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover { background: var(--rood); color: white; }

    .tab-pane { display: none; padding: 1.5rem; max-width: 780px; margin: 0 auto; }
    .tab-pane.active { display: block; }

    .video-wrap {
      position: relative; padding-bottom: 56.25%; height: 0;
      border-radius: 12px; overflow: hidden;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .sec-title {
      font-size: 1rem; font-weight: 800; color: var(--donker);
      margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.4rem;
    }

    .fc-box {
      background: white; border-radius: 16px; padding: 1.2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 1.8rem;
    }
    .fc-prog { text-align: center; font-size: 0.82rem; color: var(--grijs); margin-bottom: 0.8rem; }
    .fc-card {
      background: linear-gradient(135deg, var(--rood), #e74c3c);
      color: white; border-radius: 12px; padding: 1.8rem 1.2rem;
      min-height: 130px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      cursor: pointer; transition: background 0.3s; margin-bottom: 0.9rem;
    }
    .fc-card.flipped { background: linear-gradient(135deg, #27ae60, #2ecc71); }
    .fc-label { font-size: 0.72rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.4rem; }
    .fc-text { font-size: 1.05rem; font-weight: 700; line-height: 1.4; }
    .fc-hint { font-size: 0.72rem; opacity: 0.7; margin-top: 0.7rem; }
    .btn-row { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 0.45rem 0.9rem; border: none; border-radius: 2rem; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.82rem; cursor: pointer; }
    .btn-gray { background: #ecf0f1; color: #555; }
    .btn-red { background: var(--rood); color: white; }
    .btn-gold { background: var(--geel); color: white; }

    .mcq-box {
      background: white; border-radius: 16px; padding: 1.2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 2rem;
    }
    .mcq-prog { text-align: center; font-size: 0.82rem; color: var(--grijs); margin-bottom: 0.8rem; }
    .mcq-q { font-size: 0.98rem; font-weight: 700; color: var(--donker); margin-bottom: 0.9rem; line-height: 1.5; min-height: 2rem; }
    .mcq-opts { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 0.8rem; }
    .mcq-opt {
      padding: 0.65rem 1rem; border: 2px solid #ddd; border-radius: 10px;
      background: white; font-family: 'Nunito', sans-serif; font-size: 0.9rem;
      cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s;
    }
    .mcq-opt:hover:not(:disabled) { border-color: var(--rood); background: #fff5f5; }
    .mcq-opt.correct { background: #d5f5e3; border-color: #27ae60; color: #1e8449; font-weight: 700; }
    .mcq-opt.wrong { background: #fde8e8; border-color: #e74c3c; color: #c0392b; font-weight: 700; }
    .mcq-opt:disabled { cursor: default; }
    .mcq-fb { font-size: 0.88rem; font-weight: 700; min-height: 1.3rem; margin-bottom: 0.5rem; }
    .mcq-fb.goed { color: #27ae60; }
    .mcq-fb.fout { color: #e74c3c; }
    .mcq-sc { text-align: center; font-size: 0.82rem; color: var(--grijs); margin-top: 0.5rem; }
    .done-banner {
      margin-top: 1rem; padding: 1.2rem; border-radius: 12px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: white; text-align: center; font-weight: 700; font-size: 1rem;
    }
  </style>
</head>
<body>

<header>
  <a href="../index.html">← Terug</a>
  <h1>📜 Geschiedenis</h1>
</header>

<div class="hero">
  <h2>📜 Geschiedenis</h2>
  <p>3 HAVO</p>
</div>

<div class="tab-buttons">
  <button class="tab-btn active" data-tab="tab-binnenkort" onclick="showTab('tab-binnenkort')">🚧 Binnenkort</button>
</div>

<div id="tab-binnenkort" class="tab-pane active">
  <div class="fc-box">
    <p>Hier komt de oefenstof voor Geschiedenis zodra het eerste proefwerk bekend is.</p>
  </div>
</div>

<script>
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showTab(id) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
